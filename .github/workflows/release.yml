name: Release

# Manually triggered: builds the wheel + sdist for the version in pyproject.toml and publishes them
# as GitHub release v<version>. Aborts if that release or tag already exists.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are only created from main (started on ${GITHUB_REF_NAME})."
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags for the tag check and --generate-notes

      - uses: astral-sh/setup-uv@v7

      - name: Read version
        id: version
        run: |
          version="$(uv version --short)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}"

      - name: Abort if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists. Bump the version in pyproject.toml (uv version --bump patch|minor|major)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists without a release. Delete the tag or bump the version."
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run lint-imports
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Smoke test wheel
        run: |
          uv tool install --compile-bytecode dist/talkub-*-py3-none-any.whl
          talkub --help

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "talkub ${TAG}" \
            --generate-notes
