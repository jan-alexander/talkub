name: Release

# Manually triggered: builds the wheel + sdist and Nuitka binaries for the version in pyproject.toml
# and publishes them as GitHub release v<version>. Aborts if that release or tag already exists.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are only created from main (started on ${GITHUB_REF_NAME})."
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags for the tag check and --generate-notes

      - uses: astral-sh/setup-uv@v7

      - name: Read version
        id: version
        run: |
          version="$(uv version --short)"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}"

      - name: Abort if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists. Bump the version in pyproject.toml (uv version --bump patch|minor|major)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists without a release. Delete the tag or bump the version."
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run lint-imports
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Install test tools
        run: |
          ./scripts/install-ci-tools.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test
        env:
          TALKUB_TESTS_REQUIRE_TOOLS: "1"
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Smoke test wheel
        run: |
          uv tool install --compile-bytecode dist/talkub-*-py3-none-any.whl
          talkub --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist/*

  binary:
    needs: prepare
    strategy:
      matrix:
        # Linux on 22.04: the binary needs at least the glibc it was built against (2.35).
        runner: [macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7

      - name: Install patchelf
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Build binary
        env:
          UV_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: ./scripts/build-binary.sh

      - name: Smoke test binary
        run: |
          bin="$(ls dist/talkub-*-*-*)"
          "$bin" --version
          "$bin" --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist-binary-${{ matrix.runner }}
          path: dist/talkub-*-*-*

  release:
    needs: [prepare, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "talkub ${TAG}" \
            --generate-notes
