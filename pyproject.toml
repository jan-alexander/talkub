[project]
name = "talkub"
version = "0.1.0"
description = "Admin CLI for Talos Linux clusters managed with ArgoCD, SOPS/age and Sealed Secrets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27",
    "ruamel.yaml>=0.18",
    "yamllint>=1.38.0",
]

[project.scripts]
talkub = "talkub.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talkub"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
