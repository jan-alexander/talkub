[project]
name = "talkub"
version = "0.1.0"
description = "Admin CLI for Talos Linux clusters managed with ArgoCD, SOPS/age and Sealed Secrets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27",
    "ruamel.yaml>=0.18",
    "yamllint>=1.38.0",
]

[project.scripts]
talkub = "talkub.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talkub"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=8",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.importlinter]
root_package = "talkub"

# Higher layers may import lower ones, never the reverse; `|` separates independent siblings.
# See docs/superpowers/specs/2026-09-26-talkub-package-structure-design.md.
[[tool.importlinter.contracts]]
name = "Domain layers"
type = "layers"
containers = ["talkub"]
layers = [
    "cli",
    "scaffold | overview",
    "gitops | workstation",
    "quality",
    "helm | talos",
    "argocd",
    "kube",
    "context",
    "secrets",
    "config",
    "core",
]
